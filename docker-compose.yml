# Local container run for the demo.
#   docker compose up --build
# Then open http://localhost:8000/docs
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Pulled from your shell / .env file at compose time.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-auto}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=sqlite:////app/data/conversations.db
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    volumes:
      # Persist the demo SQLite DB across restarts.
      - agent-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  agent-data:
